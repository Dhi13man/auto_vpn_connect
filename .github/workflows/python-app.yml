name: Python App Lint / Build / Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Lint with flake8
        run: flake8 $(git ls-files '*.py') --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Analyze with pylint
        run: pylint $(git ls-files '*.py')
      - name: Audit dependencies
        if: matrix.python-version == '3.14'
        run: python -m pip_audit -r requirements-dev.txt
      - name: Build executable
        if: matrix.python-version == '3.14'
        run: pyinstaller --onefile --noconsole --name auto_vpn_connect __main__.py
      - name: Test
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70
